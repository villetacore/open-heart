# Воркспейс OpenHeart.
#
#   core/    — правила игры: симуляция, генерация мира, боевые формулы, данные.
#              Не знает про движок. Линкуется в клиент и собирается в core.wasm,
#              который крутит сервер (docs/MULTIPLAYER.md §4).
#   client/  — клиент: расширение движка (GDExtension) — узлы, рендер, ввод, HUD.
#
# Сборка клиента:          cargo build -p openheart --release
# Сборка ядра для сервера: cargo build -p openheart-core --target wasm32-unknown-unknown --features abi --release

[workspace]
members = ["core", "client"]
resolver = "2"
