# Конфиг мастер-сервера OpenHeart (oh-master).
# Скопируй в master.toml. Мастер держит список публичных серверов, аккаунты
# и (с этапа N4) релей для хостов без белого IP.

listen     = "127.0.0.1:7780"
db         = "master.db"
key        = "master.key"    # ed25519, создаётся при первом запуске, НЕ коммитить
public_url = ""              # "https://master.example.com" — для relay-эндпоинтов
relay      = true            # разрешить серверам подключаться через релей (N4)
